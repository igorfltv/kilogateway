[project]
name = "company-ai-gateway"
version = "0.1.0"
description = "Corporate Keycloak credential broker and streaming AI gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "sqlalchemy==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "PyJWT[crypto]==2.10.1",
  "cryptography==44.0.2",
  "pydantic-settings==2.8.1",
  "greenlet==3.5.6",
  "prometheus-client==0.22.1",
]
[dependency-groups]
dev = [
    "pytest==8.3.5",
 "pytest-asyncio==0.26.0",
 "pyyaml==6.0.2",
 "ruff==0.11.5",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", ".."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
