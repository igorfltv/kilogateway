apiVersion: batch/v1
kind: Job
metadata:
  name: y-ai-migrate-002
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: y-ai-migrate
    spec:
      serviceAccountName: y-ai
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: y-ai-gateway
        args:
        - python
        - -m
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: y-ai-config
        - secretRef:
            name: y-ai-migration-secrets
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
